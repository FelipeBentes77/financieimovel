# Rotina diária do site:
# 1) busca no Banco Central a divulgação mais recente de taxas e regrava dados/taxas.js se houver novidade;
# 2) regrava as páginas com o mês vigente (títulos, descrições e sitemap) quando o mês vira.
# Só publica quando alguma coisa mudou.
name: Atualizar taxas

on:
  schedule:
    - cron: '0 9 * * *'   # 06h de Brasília
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node atualizar-taxas.mjs
      - run: node gerar-blog.mjs
      - run: node gerar-seo.mjs
      - name: Publicar se houve mudança
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nada mudou: mesmas taxas e mesmo mês."
          else
            git config user.name "atualizador-de-taxas"
            git config user.email "actions@users.noreply.github.com"
            git add -A
            git commit -m "Atualização automática: taxas do Banco Central e mês vigente"
            git push
          fi
